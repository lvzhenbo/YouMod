[package]
name = "you-mod"
version = "0.1.0"
edition = "2024"
description = "A standalone Rust desktop tool that patches the Wand/WeMod Electron app to unlock Pro membership and disable updates."
license = "Apache-2.0"
repository = "https://github.com/k1tbyte/you-mod"

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui_platform = { git = "https://github.com/zed-industries/zed", package = "gpui_platform" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }
asar-rust = "0.1.0"
regex = { version = "1.12.3", default-features = false, features = [
    "std",
    "perf",
] }
anyhow = "1.0.102"
thiserror = "2.0.18"
dirs = "6.0.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
